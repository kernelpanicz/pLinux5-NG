
name: Build pLinux5-NG

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.manifest.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version from manifest
        id: manifest
        run: |
          version="$(
            sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
              source/manifest/manifest.c | head -n1
          )"

          if [ -z "$version" ]; then
            echo "Could not read .version from source/manifest/manifest.c" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $version"

      - name: Install dependencies
        run: |
          sudo apt-get update

          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21

          sudo apt-get install -y \
            clang-21 \
            lld-21 \
            llvm-21 \
            gcc \
            make \
            binutils \
            python3 \
            wget \
            unzip \
            ca-certificates

          # Expose unversioned LLVM tools to the pLabs5 llvm-config shim.
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"

      - name: Download PS5 Payload SDK
        run: |
          wget -q \
            -O ps5-payload-sdk.zip \
            https://github.com/ps5-payload-dev/sdk/releases/download/v0.44/ps5-payload-sdk.zip

          echo "4d06eab777bb135705b5a6816688c9132efb246093fe606ac488ab6cf65ca5b0  ps5-payload-sdk.zip" \
            | sha256sum --check -

          sudo unzip -q -d /opt ps5-payload-sdk.zip

          test -f /opt/ps5-payload-sdk/toolchain/prospero.mk

      - name: Checkout pLabs5 SDK
        uses: actions/checkout@v5
        with:
          repository: pLabs5/pLabs5-SDK
          path: pLabs5-SDK

      - name: Diagnose offsets header
        run: |
          set -eu

          echo "===== Repository ====="
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch/ref: ${GITHUB_REF}"
          echo "Workspace: ${GITHUB_WORKSPACE}"
          echo

          echo "===== All offsets.h files ====="
          find . -type f -name offsets.h -print
          echo

          echo "===== Tracked offsets.h files ====="
          git ls-files '*offsets.h'
          echo

          echo "===== Expected declarations in include/offsets/offsets.h ====="
          grep -nE \
            'HV_MP_STARTUP_CALL|MP_STARTUP_INIT_VECTOR|DATA_CAVE|HV_EFI_MAP_ROOT|GAD_STORE_RCX_R8_RET|GAD_STORE_RCX_R8' \
            include/offsets/offsets.h || true
          echo

          echo "===== Structure definition ====="
          grep -n -A 85 'typedef struct _offset_list' \
            include/offsets/offsets.h || true
          echo

          echo "===== Working tree status ====="
          git status --short
          echo

          echo "===== Header checksum ====="
          sha256sum include/offsets/offsets.h

      - name: Install/build configuration check
        run: |
          echo "===== Makefile compiler configuration ====="
          grep -nE \
            'prospero-clang|LLVM_CONFIG|CPPFLAGS|CFLAGS|INCLUDES|offsets.h' \
            Makefile || true

          echo
          echo "===== Compiler version ====="
          /opt/ps5-payload-sdk/bin/prospero-clang --version

        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
          LLVM_CONFIG: ${{ github.workspace }}/pLabs5-SDK/tools/nixos/llvm-config

      - name: Build pLinux5-NG
        run: |
          make clean
          make -j"$(nproc)"
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
          LLVM_CONFIG: ${{ github.workspace }}/pLabs5-SDK/tools/nixos/llvm-config

      - name: Generate checksum
        run: |
          sha256sum bin/pLinux5-NG.elf > bin/pLinux5-NG.elf.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: pLinux5-NG
          path: |
            bin/pLinux5-NG.elf
            bin/pLinux5-NG.elf.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="${{ needs.build.outputs.version }}"

          if [ "$tag" != "$manifest" ]; then
            echo "Tag v$tag does not match manifest version $manifest" >&2
            exit 1
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: pLinux5-NG
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: pLinux5-NG v${{ needs.build.outputs.version }}
          files: |
            release/pLinux5-NG.elf
            release/pLinux5-NG.elf.sha256
          generate_release_notes: true
